name: Desktop release
on:
  workflow_dispatch:
    inputs:
      reuse_mac_run:
        description: 'Optional prior run containing verified desktop packages with identical application sources'
        required: false
        type: string
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-2022 }
          - { name: macos-arm64, os: macos-15 }
          - { name: macos-x64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Verify the reused Windows installer source is identical
        id: previous_windows_package
        if: runner.os == 'Windows' && inputs.reuse_mac_run
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
          REUSE_MAC_RUN: '${{ inputs.reuse_mac_run }}'
        run: |
          [[ "$REUSE_MAC_RUN" =~ ^[0-9]+$ ]]
          old=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_MAC_RUN" --jq .head_sha)
          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_MAC_RUN/jobs" --jq '.jobs[] | select(.name == "Build windows-x64") | .conclusion')
          if [[ "$result" == success ]] && git diff --quiet "$old" "$GITHUB_SHA" -- . ':(exclude).github/workflows/release.yml'; then
            echo 'verified=true' >> "$GITHUB_OUTPUT"
            echo "Reusing the installed and verified Windows package from $REUSE_MAC_RUN; all application sources and tests are byte-identical."
          fi
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows' && steps.previous_windows_package.outputs.verified == 'true'
        with:
          name: windows-x64
          path: .release/reused-windows
          run-id: ${{ inputs.reuse_mac_run }}
          github-token: ${{ github.token }}
      - name: Verify the reused Mac application source is identical
        if: runner.os == 'macOS' && inputs.reuse_mac_run
        env:
          GH_TOKEN: '${{ github.token }}'
          REUSE_MAC_RUN: '${{ inputs.reuse_mac_run }}'
        run: |
          [[ "$REUSE_MAC_RUN" =~ ^[0-9]+$ ]]
          old=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_MAC_RUN" --jq .head_sha)
          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_MAC_RUN/jobs" --jq '.jobs[] | select(.name == "Build ${{ matrix.name }}") | .conclusion')
          [[ "$result" == success ]]
          git diff --exit-code "$old" "$GITHUB_SHA" -- server src scripts src-tauri package.json package-lock.json LICENSE LICENSE.details THIRD_PARTY_NOTICES.md THIRD-PARTY-NOTICES.md licenses index.html vite.config.ts
      - uses: actions/download-artifact@v4
        if: runner.os == 'macOS' && inputs.reuse_mac_run
        with:
          name: ${{ matrix.name }}
          path: reuse
          run-id: ${{ inputs.reuse_mac_run }}
          github-token: ${{ github.token }}
      - name: Recheck the verified Mac archive on its native architecture
        if: runner.os == 'macOS' && inputs.reuse_mac_run
        run: |
          mkdir -p release .release/reused
          tar -xzf 'reuse/release/doda-${{ matrix.name }}.tar.gz' -C .release/reused
          arch=$(uname -m)
          if [[ "$arch" == x86_64 ]]; then arch=x64; fi
          .release/reused/doda.app/Contents/Resources/runtime/darwin-$arch/bin/node scripts/verify-desktop.mjs .release/reused/doda.app '${{ matrix.name }}-smoke.json'
          mv 'reuse/release/doda-${{ matrix.name }}.tar.gz' release/
      - uses: actions/setup-node@v4
        if: (runner.os == 'Windows' && steps.previous_windows_package.outputs.verified != 'true') || !inputs.reuse_mac_run
        with:
          node-version: '24.16.0'
          cache: npm
      - uses: Swatinem/rust-cache@v2
        if: (runner.os == 'Windows' && steps.previous_windows_package.outputs.verified != 'true') || !inputs.reuse_mac_run
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci --no-audit --no-fund
        if: (runner.os == 'Windows' && steps.previous_windows_package.outputs.verified != 'true') || !inputs.reuse_mac_run
      - run: npm run build
        if: (runner.os == 'Windows' && steps.previous_windows_package.outputs.verified != 'true') || !inputs.reuse_mac_run
      - run: npx playwright install --only-shell chromium
        if: (runner.os == 'Windows' && steps.previous_windows_package.outputs.verified != 'true') || !inputs.reuse_mac_run
      - name: Verify prior Windows unit results against identical sources and tests
        id: previous_windows_units
        if: runner.os == 'Windows' && inputs.reuse_mac_run && steps.previous_windows_package.outputs.verified != 'true'
        shell: bash
        env:
          GH_TOKEN: '${{ github.token }}'
          REUSE_MAC_RUN: '${{ inputs.reuse_mac_run }}'
        run: |
          [[ "$REUSE_MAC_RUN" =~ ^[0-9]+$ ]]
          old=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_MAC_RUN" --jq .head_sha)
          result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REUSE_MAC_RUN/jobs" --jq '.jobs[] | select(.name == "Build windows-x64") | .steps[] | select(.name == "Windows unit checks in five shuffled runs") | .conclusion')
          if [[ "$result" == success ]] && git diff --quiet "$old" "$GITHUB_SHA" -- . ':(exclude).github/workflows/release.yml'; then
            echo 'verified=true' >> "$GITHUB_OUTPUT"
            echo "Reusing five successful shuffled unit runs from $REUSE_MAC_RUN; all application sources and tests are byte-identical."
          fi
      - name: Windows unit checks in five shuffled runs
        if: runner.os == 'Windows' && steps.previous_windows_package.outputs.verified != 'true' && steps.previous_windows_units.outputs.verified != 'true'
        shell: pwsh
        run: |
          foreach ($seed in @(8641,8642,8643,8644,8645)) {
            node node_modules/vitest/vitest.mjs run --project unit --maxWorkers=3 --sequence.shuffle --sequence.seed=$seed
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Native DSH protocol integration
        if: (runner.os == 'Windows' && steps.previous_windows_package.outputs.verified != 'true') || !inputs.reuse_mac_run
        run: npm run test:runtime
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows' && steps.previous_windows_package.outputs.verified != 'true'
        with: { python-version: '3.13' }
      - name: Prepare verified Windows speech model with streamed extraction
        if: runner.os == 'Windows' && steps.previous_windows_package.outputs.verified != 'true'
        timeout-minutes: 10
        shell: pwsh
        run: |
          @'
          import hashlib, pathlib, tarfile, time, urllib.request
          workspace = pathlib.Path.cwd().resolve()
          root = (workspace / '.release/resources/asr').resolve()
          downloads = (workspace / '.release/downloads').resolve()
          assert root.is_relative_to(workspace) and downloads.is_relative_to(workspace)
          root.mkdir(parents=True, exist_ok=True)
          downloads.mkdir(parents=True, exist_ok=True)
          model = 'sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17'
          archive = downloads / 'asr.tar.bz2'
          source = f'https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/{model}.tar.bz2'
          digest, size, marker, started = hashlib.sha256(), 0, 0, time.monotonic()
          print('Downloading the public speech model archive', flush=True)
          request = urllib.request.Request(source, headers={'User-Agent': 'doda-release'})
          with urllib.request.urlopen(request, timeout=60) as response, archive.open('wb') as output:
              while chunk := response.read(1024 * 1024):
                  if time.monotonic() - started > 240:
                      raise TimeoutError('ASR_DOWNLOAD_TIMEOUT')
                  output.write(chunk)
                  digest.update(chunk)
                  size += len(chunk)
                  if size // (32 * 1024 * 1024) > marker:
                      marker = size // (32 * 1024 * 1024)
                      print(f'Downloaded {size // (1024 * 1024)} MiB', flush=True)
          assert digest.hexdigest() == '7d1efa2138a65b0b488df37f8b89e3d91a60676e416f515b952358d83dfd347e', 'ASR_CHECKSUM_MISMATCH'
          print('Archive checksum verified; extracting in one pass', flush=True)
          with tarfile.open(archive, mode='r|bz2') as package:
              for member in package:
                  assert (member.name == model and member.isdir()) or member.name.startswith(model + '/'), 'ASR_ARCHIVE_PREFIX_INVALID'
                  assert member.isdir() or member.isfile(), 'ASR_ARCHIVE_TYPE_INVALID'
                  assert (root / member.name).resolve().is_relative_to(root), 'ASR_ARCHIVE_PATH_INVALID'
                  print(f'Extracting {member.name}', flush=True)
                  package.extract(member, path=root, filter='data')
          assert (root / model / 'model.int8.onnx').is_file() and (root / model / 'tokens.txt').is_file()
          archive.unlink()
          print('Verified Windows speech model ready', flush=True)
          '@ | python -u -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: npm run release:prepare
        if: (runner.os == 'Windows' && steps.previous_windows_package.outputs.verified != 'true') || !inputs.reuse_mac_run
      - name: Use fast Windows installer compression without quadratic file deduplication
        if: runner.os == 'Windows' && steps.previous_windows_package.outputs.verified != 'true'
        run: node -e "const fs=require('fs'),p='.release/tauri.release.json',c=JSON.parse(fs.readFileSync(p));c.bundle.windows.nsis.compression='zlib';c.bundle.windows.nsis.installerHooks='../.release/windows-compiler.nsh';fs.writeFileSync('.release/windows-compiler.nsh','SetDatablockOptimize off'+String.fromCharCode(10));fs.writeFileSync(p,JSON.stringify(c,null,2))"
      - name: Rust platform contracts
        if: (runner.os == 'Windows' && steps.previous_windows_package.outputs.verified != 'true') || !inputs.reuse_mac_run
        working-directory: src-tauri
        run: cargo test --locked
      - run: npm run release:build
        if: (runner.os == 'Windows' && steps.previous_windows_package.outputs.verified != 'true') || !inputs.reuse_mac_run
      - name: Install and verify Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        env: { REUSE_WINDOWS_PACKAGE: '${{ steps.previous_windows_package.outputs.verified }}' }
        run: |
          if ($env:REUSE_WINDOWS_PACKAGE -eq 'true') {
            $package = Get-Item -LiteralPath '.release/reused-windows/release/doda-0.1.0-windows-x64-setup.exe'
          } else {
            $package = Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' | Select-Object -First 1
          }
          if (-not $package) { throw 'WINDOWS_INSTALLER_MISSING' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'doda installed test'
          $process = Start-Process -FilePath $package.FullName -ArgumentList @('/S', ('/D=' + $installRoot)) -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'WINDOWS_INSTALL_FAILED' }
          & (Join-Path $installRoot 'runtime/win32-x64/bin/node.exe') scripts/verify-desktop.mjs $installRoot windows-smoke.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -LiteralPath $package.FullName -Destination 'release/doda-0.1.0-windows-x64-setup.exe'
      - name: Verify and archive Mac application
        if: runner.os == 'macOS' && !inputs.reuse_mac_run
        run: |
          app='src-tauri/target/release/bundle/macos/doda.app'
          arch=$(node -p process.arch)
          "$app/Contents/Resources/runtime/darwin-$arch/bin/node" scripts/verify-desktop.mjs "$app" '${{ matrix.name }}-smoke.json'
          mkdir -p release
          tar -czf 'release/doda-${{ matrix.name }}.tar.gz' -C src-tauri/target/release/bundle/macos doda.app
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            release/*
            *-smoke.json
          if-no-files-found: error
  universal:
    name: Assemble and verify Mac universal package
    needs: build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: macos-arm64, path: arm64 }
      - uses: actions/download-artifact@v4
        with: { name: macos-x64, path: x64 }
      - name: Merge Mac architecture binaries
        run: |
          mkdir -p universal/x64 release image
          tar -xzf arm64/release/doda-macos-arm64.tar.gz -C image
          tar -xzf x64/release/doda-macos-x64.tar.gz -C universal/x64
          mv universal/x64/doda.app/Contents/Resources/runtime/darwin-x64 image/doda.app/Contents/Resources/runtime/
          lipo -create image/doda.app/Contents/MacOS/doda-desktop universal/x64/doda.app/Contents/MacOS/doda-desktop -output universal/doda-desktop
          mv universal/doda-desktop image/doda.app/Contents/MacOS/doda-desktop
          lipo -create image/doda.app/Contents/Resources/helpers/doda-keychain universal/x64/doda.app/Contents/Resources/helpers/doda-keychain -output universal/doda-keychain
          mv universal/doda-keychain image/doda.app/Contents/Resources/helpers/doda-keychain
          lipo image/doda.app/Contents/MacOS/doda-desktop -verify_arch arm64 x86_64
          lipo image/doda.app/Contents/Resources/helpers/doda-keychain -verify_arch arm64 x86_64
          image/doda.app/Contents/Resources/runtime/darwin-arm64/bin/node -e 'const fs=require("fs"),root="image/doda.app/Contents/Resources/",a=JSON.parse(fs.readFileSync(root+"release.json"));a.arch="universal";a.runtimes=["arm64","x64"];fs.writeFileSync(root+"release.json",JSON.stringify(a,null,2))'
      - name: Sign and verify universal Mac application
        run: |
          codesign --force --deep --sign - image/doda.app
          codesign --verify --deep --strict image/doda.app
          image/doda.app/Contents/Resources/runtime/darwin-arm64/bin/node scripts/verify-desktop.mjs image/doda.app macos-universal-arm64-smoke.json
      - name: Create and verify universal Mac disk image
        run: |
          ln -s /Applications image/Applications
          hdiutil create -volname doda -srcfolder image -ov -format UDZO release/doda-0.1.0-macos-universal.dmg
          for attempt in 1 2 3 4 5; do
            if result=$(hdiutil verify release/doda-0.1.0-macos-universal.dmg 2>&1); then
              printf '%s\n' "$result"
              break
            fi
            printf '%s\n' "$result"
            [[ "$result" == *'Resource temporarily unavailable'* && "$attempt" != 5 ]] || exit 1
            sleep $((attempt * 2))
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            release/doda-0.1.0-macos-universal.dmg
            macos-universal-arm64-smoke.json
          if-no-files-found: error
  universal-intel:
    name: Verify universal package on Intel Mac
    needs: universal
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: macos-universal, path: universal }
      - run: |
          mkdir -p mounted
          hdiutil attach universal/release/doda-0.1.0-macos-universal.dmg -readonly -nobrowse -mountpoint "$PWD/mounted"
          mounted/doda.app/Contents/Resources/runtime/darwin-x64/bin/node scripts/verify-desktop.mjs mounted/doda.app macos-universal-x64-smoke.json
          hdiutil detach "$PWD/mounted"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal-intel-check
          path: macos-universal-x64-smoke.json
  publish:
    name: Publish two download packages
    needs: [build, universal, universal-intel]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: windows-x64, path: windows }
      - uses: actions/download-artifact@v4
        with: { name: macos-universal, path: macos }
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" != v* ]]; then tag="v$(node -p "require('./package.json').version")"; fi
          gh release create "$tag" windows/release/doda-0.1.0-windows-x64-setup.exe macos/release/doda-0.1.0-macos-universal.dmg --target "$GITHUB_SHA" --title "doda 0.1.0" --notes-file RELEASE_NOTES.md
