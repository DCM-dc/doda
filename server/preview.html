function navigate(options,mode){try{const [raw,query='']=String(options.url||'').split('?');const route=raw.replace(/^\//,'');if(!Object.hasOwn(source.pages,route))throw new Error('PREVIEW_PAGE_NOT_REGISTERED: '+route);loadModule(route+'.js');const config=configs[route];if(!config)throw new Error('PREVIEW_PAGE_NOT_DEFINED: '+route);const entry={route,options:Object.fromEntries(new URLSearchParams(query)),instance:{...config,data:copy(config.data||{}),route,options:Object.fromEntries(new URLSearchParams(query)),setData,selectComponent,selectAllComponents,_previewComponents:new Map()}};if(mode==='push'){instance.onHide?.();pageComponentLife(instance,'hide')}if(mode==='replace'&&stack.length)unloadPage(stack.pop().instance);if(mode==='reset')while(stack.length)unloadPage(stack.pop().instance);stack.push(entry);activate(entry,true);options.success?.({errMsg:'navigateTo:ok'})}catch(error){options.fail?.({errMsg:error.message});document.querySelector('#app').textContent='布局预览暂不支持这个页面：'+error.message}finally{options.complete?.()}}
window.addEventListener('message',async event=>{if(event.source!==parent||event.data?.type!=='doda-preview-capture'||typeof event.data.id!=='string')return;const id=event.data.id;try{await document.fonts.ready;const data=await htmlToImage.toPng(document.body,{width:innerWidth,height:innerHeight,pixelRatio:1,skipFonts:true,backgroundColor:getComputedStyle(document.body).backgroundColor,style:{transform:`translate(${-scrollX}px,${-scrollY}px)`,transformOrigin:'top left'}});parent.postMessage({type:'doda-preview-captured',id,page:currentRoute,data},'*')}catch{parent.postMessage({type:'doda-preview-captured',id,error:'PREVIEW_CAPTURE_FAILED'},'*')}})
try{loadModule('app.js');navigate({url:'/'+source.page},'reset')}catch(error){document.querySelector('#app').textContent='布局预览暂不支持这个页面：'+error.message}
</script></body></html>
